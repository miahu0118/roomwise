<style>
/* Layout: one phone-sized app, centered on a desk surface; a flow map sits beside it on wide screens. Light only, by request (white app). */
:root{
  --bg:#FFFFFF; --fg:#141414; --sub:#6D6B67; --mute:#A3A09B; --line:#ECEAE5; --soft:#F6F5F2;
  --acc:#D63C27; --acc-soft:#FDEEEA; --ok:#1E8455; --ok-soft:#E7F3EC; --warn:#8F5600; --warn-soft:#FFF2DC;
  --desk:#E9E6E0; --ink:#141414;
  --display:'Montserrat',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--desk);color:var(--fg);font-family:var(--body);font-size:13.5px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[data-a]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{min-height:100%;display:flex;gap:40px;justify-content:center;align-items:center;padding:24px}
.flow{width:250px;max-height:calc(100vh - 48px);overflow:auto;font-size:12.5px}
.flow h3{font-family:var(--display);font-size:15px;margin:0 0 4px}
.flow p{color:var(--sub);margin:0 0 14px;line-height:1.45}
.flow .st{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:600;margin:14px 0 4px}
.flow button{display:block;width:100%;text-align:left;padding:5px 8px;border-radius:7px;color:var(--fg)}
.flow button:hover{background:rgba(0,0,0,.05)}
.flow button.on{background:var(--fg);color:var(--bg);font-weight:600}
.flow .reset{margin-top:16px;border:1px solid rgba(0,0,0,.15);text-align:center;font-weight:600}
.phone{width:390px;height:844px;transform-origin:center center;background:var(--bg);border-radius:48px;border:9px solid #161616;box-shadow:0 30px 60px -20px rgba(40,30,20,.35);position:relative;overflow:hidden;display:flex;flex-direction:column;flex:none}
.sbar{height:40px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0;font-weight:600;font-size:14px}
.sbar i{font-style:normal;letter-spacing:1px;font-size:11px}
@media (max-width:760px){.flow{display:none}.wrap{padding:12px}}
@media (pointer:coarse) and (max-width:500px){
  .wrap{padding:0;display:block;height:100%}
  .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none;transform:none!important;margin:0!important}
  .sbar{display:none}
}
/* top bar */
.top{flex:none;padding:6px 16px 0;display:flex;align-items:center;gap:10px;min-height:52px}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none;position:relative}
.iconbtn .n{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--acc);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.ttl{flex:1;min-width:0}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);font-weight:600}
.ttl h1{font-family:var(--display);font-weight:700;font-size:18px;margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;gap:8px}
.stages{display:flex;gap:4px;padding:10px 16px 8px;flex:none}
.stages div{flex:1;font-size:10px;color:var(--mute);font-weight:500}
.stages div::before{content:"";display:block;height:3px;border-radius:2px;background:var(--line);margin-bottom:4px}
.stages .done{color:var(--sub)} .stages .done::before{background:var(--fg)}
.stages .cur{color:var(--fg);font-weight:700} .stages .cur::before{background:var(--acc)}

/* ---------- screens ---------- */
const V={};
V.welcome=()=>({noTop:true,body:`
 <div class="bleed"><div class="render">${room('design',{markers:false})}</div></div>
 <div class="stack s12">
  <div class="hero-n">Roomwise</div>
  <p class="lead">Scan your room, get a design made from your taste and your real measurements, then let an agent buy every piece.</p>
 </div>
 <div class="list">
  ${[['Style','Pick a room, style words and pictures you like'],['Measure','Scan the room and take one photo'],['Design','Choose a budget and a design, then edit items'],['Shop','Pick real products, check the cart, the agent orders']].map((s,i)=>`<div class="li"><span class="nb">${i+1}</span><div class="grow"><div class="t">${s[0]}</div><div class="meta">${s[1]}</div></div></div>`).join('')}
 </div>`,
 bottom:`<button class="btn" data-a="go" data-v="project">Start a project</button><div class="hint">About 10 minutes · demo with sample data</div>`});

V.project=()=>({stage:1,eyebrow:'Step 1 · Style',title:'Your project',body:`
 <div class="stack s4"><h2>What are we designing?</h2><p class="lead">This sets which furniture we suggest.</p></div>
 <div class="grid2">${[['Living room','Sofa, lounge, TV'],['Bedroom','Bed, nightstands'],['Home office','Desk, shelving'],['Dining nook','Table, seating']].map(([k,s])=>`<button class="sel ${S.scenario===k?'on':''}" data-a="set" data-v="scenario|${k}"><span class="t" style="font-weight:600">${k}</span><span class="meta">${s}</span></button>`).join('')}</div>
 <div class="stack s4"><h3>How much of the room?</h3></div>
 <div class="grid2">${[['Full room','Redesign the whole space'],['A corner','One area, like a reading nook']].map(([k,s])=>`<button class="sel ${S.scope===k?'on':''}" data-a="set" data-v="scope|${k}"><span style="font-weight:600">${k}</span><span class="meta">${s}</span></button>`).join('')}</div>`,
 bottom:`<button class="btn" data-a="go" data-v="keywords">Continue</button>`});

V.keywords=()=>({stage:1,eyebrow:'Step 1 · Style',title:'Style keywords',body:`
 <div class="stack s4"><h2>Pick up to 5 words that feel like you</h2><p class="lead"><b class="num">${S.kw.length} of 5</b> selected. The order you tap sets their weight.</p></div>
 <div class="chips">${Object.keys(KW).map(k=>{const i=S.kw.indexOf(k);return `<button class="chip ${i>=0?'on':''}" data-a="kw" data-v="${k}" aria-pressed="${i>=0}">${i>=0?`<span class="num">${i+1}</span>`:''}${k}</button>`;}).join('')}</div>`,
 bottom:`<button class="btn" data-a="go" data-v="pictures" ${S.kw.length?'':'disabled'}>Continue</button>${S.kw.length?'':'<div class="hint">Pick at least one word</div>'}`});

V.pictures=()=>({stage:1,eyebrow:'Step 1 · Style',title:'Pictures you like',body:`
 <div class="stack s4"><h2>Pick up to 3 rooms you like</h2><p class="lead"><b class="num">${S.pics.length} of 3</b> selected. We show 3 takes on each of your words.</p></div>
 ${S.kw.map(k=>`<div class="stack"><div class="label">${k}</div><div class="grid3">${[0,1,2].map(v=>{const id=k+'-'+v,on=S.pics.includes(id);return `<button class="tile ${on?'on':''}" data-a="pic" data-v="${id}" aria-pressed="${on}" aria-label="${k} picture ${v+1}">${mood(k,v)}<span class="ck">${on?IC.check('#fff',14):''}</span></button>`;}).join('')}</div></div>`).join('')}`,
 bottom:`<button class="btn" data-a="go" data-v="scanSetup" ${S.pics.length?'':'disabled'}>Continue to measuring</button>`});

V.scanSetup=()=>({stage:2,eyebrow:'Step 2 · Measure',title:'Scan your room',body:`
 <div class="stack s4"><h2>How should we measure?</h2><p class="lead">A short video scan gives us walls, windows and doors in about a minute.</p></div>
 <div class="stack">${[['RoomPlan','iPhone or iPad with LiDAR · most accurate'],['ARCore','Android phones · good accuracy'],['Manual','Type the measurements yourself']].map(([k,s])=>`<button class="sel ${S.method===k?'on':''}" data-a="set" data-v="method|${k}" style="flex-direction:row;align-items:center;gap:12px"><span class="radio ${S.method===k?'on':''}"></span><span class="stack s4" style="gap:2px"><span style="font-weight:600">${k}</span><span class="meta">${s}</span></span></button>`).join('')}</div>
 <div class="note"><b>Before you start:</b> turn on the lights, open the curtains, and walk slowly along the walls with the phone at chest height.</div>`,
 bottom:`<button class="btn" data-a="startScan">${S.method==='Manual'?'Enter measurements':'Start scan'}</button>`});

V.scanning=()=>{const p=S.scanP,tips=['Point at the corner where two walls meet','Now sweep slowly along the window wall','Tilt down to catch the floor edge','Almost done: capture the doorway'];
 return {stage:2,eyebrow:'Step 2 · Measure',title:S.rescan?'Rescanning window wall':'Guided scan',back:false,body:`
 <div class="cam">${room('photo')}<div class="grid"></div><div class="scan"></div><div class="hud">${tips[Math.min(3,Math.floor(p/25))]}</div></div>
 <div class="stack"><div style="display:flex;justify-content:space-between"><b>Scanning</b><span class="num">${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div>
 <div class="steps">${['Walls','Window','Door','Floor'].map((s,i)=>`<div class="${p>=(i+1)*25?'done':(p>=i*25?'now':'')}"><span class="ico ${p>=(i+1)*25?'ok':''}">${p>=(i+1)*25?IC.check():''}</span>${s}</div>`).join('')}</div>`,
 bottom:`<button class="btn sec" data-a="cancelScan">Cancel scan</button>`,
 after(){ if(S.scanP<100) later(()=>{S.scanP=Math.min(100,S.scanP+5);render();},110); else later(()=>{if(S.rescan){Object.assign(S.dims[3],{v:1.41,low:false,conf:93});S.rescan=false;go('review',{replace:true});toast('Window wall rescanned · 93% confidence');}else go('review',{replace:true});},400);}};};

V.review=()=>{const d=S.dims,low=d.find(x=>x.low);const W=d[0].v,Lg=d[1].v,sc=Math.min(230/W,150/Lg);
 const pw=W*sc,ph=Lg*sc,ox=(358-pw)/2,oy=18;
 return {stage:2,eyebrow:'Step 2 · Measure',title:'Check measurements',body:`
 <div class="render" style="background:var(--soft)"><svg viewBox="0 0 358 ${ph+46}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Floor plan">
  <rect x="${ox}" y="${oy}" width="${pw}" height="${ph}" fill="#fff" stroke="#141414" stroke-width="3"/>
  <line x1="${ox}" y1="${oy+ph*.2}" x2="${ox}" y2="${oy+ph*.2+d[3].v*sc}" stroke="${low?'#C77700':'#1E8455'}" stroke-width="7"/>
  <path d="M${ox+pw-d[4].v*sc-14} ${oy+ph} a${d[4].v*sc} ${d[4].v*sc} 0 0 1 ${d[4].v*sc} -${d[4].v*sc}" fill="none" stroke="#A3A09B" stroke-dasharray="3 3"/>
  <line x1="${ox+pw-d[4].v*sc-14}" y1="${oy+ph}" x2="${ox+pw-14}" y2="${oy+ph}" stroke="#fff" stroke-width="4"/>
  <text x="${ox+pw/2}" y="${oy+ph+20}" text-anchor="middle" font-family="Figtree,sans-serif" font-size="12" font-weight="600" fill="#141414">${W.toFixed(2)} m</text>
  <text x="${ox+pw+10}" y="${oy+ph/2}" font-family="Figtree,sans-serif" font-size="12" font-weight="600" fill="#141414">${Lg.toFixed(2)} m</text>
  <text x="${ox-8}" y="${oy+ph*.2-6}" text-anchor="end" font-family="Figtree,sans-serif" font-size="11" fill="${low?'#8F5600':'#1E8455'}">Window</text>
 </svg></div>
 ${low?`<div class="note warn"><b>One measurement is uncertain.</b> The window width came out at ${low.conf}% confidence, probably because of glare. Fix it so furniture sizes are right.</div>`:`<div class="note ok"><b>All measurements look good.</b> You can still edit any number.</div>`}
 <div class="list">${d.map((x,i)=>`<div class="dim ${x.low?'low':''}"><div class="grow"><div style="font-weight:600">${x.k}</div><div class="small">${x.low?`Low confidence · ${x.conf}%`:(x.conf?`Confirmed · ${x.conf}%`:'From scan')}</div></div><input id="dim${i}" type="number" step="0.01" inputmode="decimal" value="${x.v.toFixed(2)}" data-in="dim" data-i="${i}" aria-label="${x.k} in meters"><span class="small">m</span></div>`).join('')}</div>
 ${low?`<div class="row2"><button class="btn sec sm" data-a="rescan">Rescan this wall</button><button class="btn dark sm" data-a="sheet" data-v="ref">Use a known length</button></div>`:''}`,
 bottom:`<button class="btn" data-a="go" data-v="photo" ${low?'disabled':''}>Looks right, continue</button>${low?'<div class="hint">Fix the window width first</div>':''}`};};

V.photo=()=>({stage:2,eyebrow:'Step 2 · Measure',title:'Photo of the area',body:`
 <div class="cam" id="cam">${room('photo')}<div class="corner"></div><div class="hud">Stand in the doorway and fit the whole area in the frame. Keep the phone level.</div></div>
 <p class="meta">We design on top of this photo, so it should show everything you want changed.</p>`,
 bottom:`<button class="shutter" data-a="shoot" aria-label="Take photo"><i></i></button>`});

V.editBase=()=>({stage:2,eyebrow:'Step 2 · Measure',title:'Edit your photo',body:`
 <div class="stack s4"><h2>What stays in the room?</h2><p class="lead">Tap a label or use the switches. Removed pieces are erased before we design.</p></div>
 <div class="cam">${room('photo',{base:S.base})}${OLD.map(o=>`<button class="tag ${S.base[o.id]==='remove'?'rm':S.base[o.id]==='move'?'mv':''}" style="left:${o.x}%;top:${o.y}%" data-a="cycleBase" data-v="${o.id}">${o.name}</button>`).join('')}</div>
 <div class="list">${OLD.map(o=>`<div class="li"><div class="grow"><div class="t">${o.name}</div><div class="meta">${{keep:'Stays where it is',move:'Stays, moved to a better spot',remove:'Erased from the photo'}[S.base[o.id]]}</div></div><div class="seg" style="width:180px">${['keep','move','remove'].map(k=>`<button class="${S.base[o.id]===k?'on':''} ${k==='remove'?'rm':''}" data-a="setBase" data-v="${o.id}|${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div></div>`).join('')}</div>
 ${keptArmchair()?'<div class="note">You kept your armchair, so the design will not add a new accent chair.</div>':''}`,
 bottom:`<button class="btn" data-a="go" data-v="tier">Continue to design</button>`});

V.tier=()=>({stage:3,eyebrow:'Step 3 · Design',title:'Spending option',body:`
 <div class="stack s4"><h2>Pick a budget</h2><p class="lead">Estimates for ${active().length} new pieces in a ${S.dims[0].v.toFixed(1)} × ${S.dims[1].v.toFixed(1)} m room, before tax.</p></div>
 <div class="stack">${TIERS.map(t=>`<button class="sel ${S.tier===t.k?'on':''}" data-a="set" data-v="tier|${t.k}"><span style="display:flex;gap:8px;align-items:center"><h3>${t.k}</h3>${t.k==='Quality'?'<span class="pill dark">Recommended</span>':''}</span><span class="price" style="color:${S.tier===t.k?'var(--acc)':'var(--fg)'}">Est. ${money0(t.lo)} – ${money0(t.hi)}</span><span class="meta">${t.s}</span></button>`).join('')}</div>`,
 bottom:`<button class="btn" data-a="startGen">Generate designs</button>`});

V.generating=()=>{const p=S.genP,st=['Erasing removed furniture','Blending '+S.kw.slice(0,3).join(' + '),'Fitting pieces to '+S.dims[0].v.toFixed(1)+' × '+S.dims[1].v.toFixed(1)+' m','Pricing in the '+S.tier+' tier'];
 return {stage:3,eyebrow:'Step 3 · Design',title:'Generating',back:false,body:`
 <div class="render" style="opacity:${.35+p/160}">${room(p>60?'design':'blank',{markers:false})}</div>
 <div class="stack s4"><h2>Making 3 designs for you</h2><p class="lead">From your ${S.kw.length} words, ${S.pics.length} pictures and your room scan.</p></div>
 <div class="steps">${st.map((s,i)=>`<div class="${p>=(i+1)*25?'done':(p>=i*25?'now':'')}"><span class="ico ${p>=(i+1)*25?'ok':''}">${p>=(i+1)*25?IC.check():(p>=i*25?'<span class="spin"></span>':'')}</span>${s}</div>`).join('')}</div>`,
 bottom:`<div class="bar"><i style="width:${p}%"></i></div>`,
 after(){ if(S.genP<100) later(()=>{S.genP=Math.min(100,S.genP+4);render();},90); else later(()=>go('candidates',{replace:true}),350);}};};

V.candidates=()=>{const mixKw=S.kw.slice(0,3),w=[45,35,20];
 return {stage:3,eyebrow:'Step 3 · Design',title:'Design options',body:`
 <div class="stack s4"><h2>3 designs, blended from your taste</h2><p class="lead">Tap the one you like best. You can edit every piece next.</p></div>
 ${CANDS.map((c,i)=>{const save=S.cand;S.cand=i;const pic=room('design',{markers:false});S.cand=save;
  return `<button class="pcard" data-a="set" data-v="cand|${i}" aria-pressed="${S.cand===i}"><div class="render" style="${S.cand===i?'outline:3px solid var(--acc);outline-offset:-3px':''}">${pic}${S.cand===i?'<span class="cap">Selected</span>':''}</div><div class="nm">${c.name}</div><div class="meta">${c.d}</div><div class="small">${mixKw.map((k,j)=>`${k} ${w[(j+i)%3]}%`).join(' · ')}</div></button>`;}).join('')}`,
 bottom:`<button class="btn" data-a="go" data-v="design">Use ${CANDS[S.cand].name.split(' · ')[0]}</button>`};};

V.design=()=>{const act=active(),rm=ITEMS.filter(i=>S.items[i.id].removed);const kept=OLD.filter(o=>S.base[o.id]!=='remove').map(o=>o.name);
 return {stage:3,eyebrow:'Step 3 · Design',title:'Your design',body:`
 <div class="bleed"><div class="render">${room('design',{pulse:S.pulse})}<span class="cap">${CANDS[S.cand].name.split(' · ')[0]} · tap a number</span></div></div>
 <p class="meta">Kept from your room: ${kept.join(', ')||'nothing'}.</p>
 <div class="list">${act.map(i=>`<button class="li" data-a="itemSheet" data-v="${i.id}"><span class="nb">${i.n}</span>${itemThumb(i.id)}<div class="grow"><div class="t">${i.name}${S.items[i.id].look?' <span class="pill acc">New version</span>':''}</div><div class="meta">Est. ${i.est}</div></div><span class="link">Edit</span></button>`).join('')}</div>
 ${rm.length?`<div class="stack"><div class="label">Removed</div>${rm.map(i=>`<div class="kv"><span>${i.n} · ${i.name}</span><button class="link" data-a="restore" data-v="${i.id}">Put back</button></div>`).join('')}</div>`:''}`,
 bottom:`<button class="btn" data-a="go" data-v="shop" ${act.length?'':'disabled'}>Shop these ${act.length} items</button>`};};

V.regen=()=>{const r=S.regen,it=item(r.id),before=conceptLook(r.id);const sug=['Smaller','Black metal','Rounder shape','Warmer wood','More texture'];
 return {stage:3,eyebrow:'Step 3 · Design',title:'Regenerate '+it.name.toLowerCase(),body:`
 <div class="ba"><div class="stack s4"><div class="label">Now</div><div class="thumb">${prodSvg(r.id,before)}</div></div><div class="stack s4"><div class="label">New version</div><div class="thumb">${r.state==='done'?prodSvg(r.id,r.look):(r.state==='loading'?'<span class="spin"></span>':'<span class="small">Not generated yet</span>')}</div></div></div>
 ${r.state==='done'?`<div class="render">${room('design',{override:{[r.id]:r.look},pulse:r.id})}<span class="cap">Preview in your room</span></div>`:''}
 <div class="stack"><label for="rgt" style="font-weight:600">What should change?</label><textarea id="rgt" data-in="regen" placeholder="e.g. smaller, black metal, a rounder shade">${esc(r.text)}</textarea>
 <div class="chips">${sug.map(s=>`<button class="chip" data-a="sug" data-v="${s}">+ ${s}</button>`).join('')}</div></div>`,
 bottom:r.state==='done'?`<div class="row2"><button class="btn sec" data-a="regenGo">Try again</button><button class="btn" data-a="regenKeep">Use this version</button></div>`:`<button class="btn" data-a="regenGo" ${r.state==='loading'?'disabled':''}>${r.state==='loading'?'Regenerating…':'Regenerate'}</button>`};};

V.shop=()=>{const act=active(),ls=lines(),t=totals(ls);
 return {stage:4,eyebrow:'Step 4 · Shop',title:'Shop your design',right:`<button class="iconbtn" data-a="go" data-v="collection" aria-label="Collection">${IC.bookmark}${S.coll.length?`<span class="n">${S.coll.length}</span>`:''}</button><button class="iconbtn" data-a="go" data-v="cart" aria-label="Cart">${IC.cart}${ls.length?`<span class="n">${ls.length}</span>`:''}</button>`,body:`
 <div class="sticky"><div class="render">${room('shop',{pulse:S.pulse})}<span class="cap">${ls.length} of ${act.length} real products placed</span></div></div>
 <div class="stack s4"><h2>Find a real product for each piece</h2><p class="lead">When you choose one, it replaces the concept in your picture.</p></div>
 <div class="list">${act.map(i=>{const pk=S.items[i.id].pick,p=pk&&prod(pk.pid);return `<button class="li" data-a="openResults" data-v="${i.id}"><span class="nb ${p?'ok':'out'}">${p?IC.check():i.n}</span>${itemThumb(i.id)}<div class="grow"><div class="t">${i.name}</div>${p?`<div class="meta ell">${p.name}</div><div class="meta">${p.store} · <span class="price" style="color:var(--fg)">${money(p.price*pk.qty)}</span></div>`:`<div class="meta">Concept · est. ${i.est}</div>`}</div><span class="link">${p?'Change':'Find'}</span></button>`;}).join('')}</div>
 ${ls.length?`<div class="sum"><span>Products so far</span><b class="price">${money(t.sub)}</b></div>`:''}`,
 bottom:`<button class="btn" data-a="go" data-v="cart" ${ls.length?'':'disabled'}>${ls.length===act.length?'View cart':'View cart'} · ${ls.length} of ${act.length} chosen</button>${ls.length?'':'<div class="hint">Choose at least one product</div>'}`};};

V.results=()=>{const it=item(S.cur);let ps=PRODUCTS[S.cur].slice();if(S.sort==='price')ps.sort((a,b)=>a.price-b.price);else if(S.sort==='fit')ps=ps.filter(p=>p.fit==='ok');else ps.sort((a,b)=>b.match-a.match);
 const pk=S.items[S.cur].pick;
 return {stage:4,eyebrow:`Item ${it.n} · ${it.name}`,title:'Product results',body:`
 <div style="display:flex;gap:12px;align-items:center">${`<div class="thumb">${prodSvg(S.cur,conceptLook(S.cur))}</div>`}<div class="grow" style="min-width:0"><div class="small">Searching with the cropped concept +</div><div style="font-weight:600;font-size:13px;line-height:1.35">“${it.q}, ${S.kw.slice(0,2).join(', ')}”</div><div class="small">${S.tier} tier · ships to [your ZIP]</div></div></div>
 <div class="chips">${[['match','Best match'],['price','Lowest price'],['fit','Fits your space']].map(([k,l])=>`<button class="chip ${S.sort===k?'on':''}" data-a="sort" data-v="${k}">${l}</button>`).join('')}</div>
 ${ps.map(p=>{const saved=S.coll.includes(p.id),chosen=pk&&pk.pid===p.id;return `<div class="pcard"><button class="pimg" data-a="openProduct" data-v="${p.id}" aria-label="Open ${p.name}">${prodSvg(S.cur,{shape:p.shape,color:chosen?pk.color:p.colors[0][1]})}${chosen?'<span class="badge pill ok">In your design</span>':`<span class="badge pill">${p.match}% match</span>`}</button>
<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><button style="text-align:left;flex:1;min-width:0" data-a="openProduct" data-v="${p.id}"><div class="nm">${p.name}</div><div class="meta"><span class="stars">${IC.star} ${p.rating}</span> (${p.reviews}) · ${p.store} · <b class="price" style="color:var(--fg)">${money0(p.price)}</b></div><div class="meta">${p.days}</div></button><button class="iconbtn" data-a="save" data-v="${p.id}" aria-label="${saved?'Remove from':'Add to'} collection" aria-pressed="${saved}">${IC.heart(saved)}</button></div>
  ${p.fit==='warn'?`<span class="pill warn" style="align-self:flex-start">${p.fitT}</span>`:''}</div>`;}).join('<div style="height:1px;background:var(--line)"></div>')}
 <p class="small">Generated pieces may only have close matches. Saving keeps a product in your Collection; only the one you place counts toward the cart.</p>`,
 bottom:`<button class="btn sec" data-a="backTo" data-v="shop">Back to all items</button>`};};

V.product=()=>{const p=prod(S.draft.pid),it=item(p.item),d=S.draft,saved=S.coll.includes(p.id);const look={shape:p.shape,color:d.color};
 return {stage:4,eyebrow:`Item ${it.n} · ${p.store}`,title:p.name,body:`
 <div class="bleed"><div class="render">${room('shop',{override:{[p.item]:look},pulse:p.item,markers:false})}<span class="cap">Preview in your room</span></div></div>
 <div class="stack s4"><div class="nm" style="font-family:var(--display);font-weight:700;font-size:19px">${p.name}</div><div class="meta"><span class="stars">${IC.star} ${p.rating}</span> (${p.reviews}) · ${p.store} · ${p.match}% visual match</div><div style="font-family:var(--display);font-weight:700;font-size:20px" class="num">${money(p.price)}</div></div>
 <div class="stack"><div class="label">Color · ${(p.colors.find(c=>c[1]===d.color)||p.colors[0])[0]}</div><div class="sw">${p.colors.map(([n,c])=>`<button class="swb ${d.color===c?'on':''}" data-a="color" data-v="${c}"><i style="background:${c}"></i>${n}</button>`).join('')}</div></div>
 <div style="display:flex;justify-content:space-between;align-items:center"><div class="label">Quantity</div><div class="qty"><button data-a="qty" data-v="-1" aria-label="Fewer">−</button><span class="num">${d.qty}</span><button data-a="qty" data-v="1" aria-label="More">+</button></div></div>
 <div class="card"><div class="kv"><span>Size</span><b>${p.dims}</b></div><div class="kv"><span>Fit</span><span class="pill ${p.fit==='ok'?'ok':'warn'}">${p.fitT}</span></div><div class="kv"><span>Delivery</span><b>${p.days}</b></div><div class="kv"><span>Vs. the concept</span><span style="text-align:right">${p.note}</span></div></div>
 <button class="btn sec sm" data-a="save" data-v="${p.id}">${IC.heart(saved)} ${saved?'Saved to Collection':'Add to Collection'}</button>`,
 bottom:`<button class="btn" data-a="place">Place in my design · ${money(p.price*d.qty)}</button>`};};

V.collection=()=>{const ps=S.coll.map(prod);
 return {stage:4,eyebrow:'Step 4 · Shop',title:'Collection',body:`
 <div class="stack s4"><h2>Saved products</h2><p class="lead">Compare what you saved, then place one per item.</p></div>

/* ---------- agent logic ---------- */
function startRun(silent){
 const ls=lines(),g=groups(ls);
 S.bump={};
 S.run={phase:'prices',checked:0,lines:ls.map(l=>l.it.id),change:null,stores:g.map(x=>({name:x.store,status:'waiting',ref:null})),needs:(g.find(x=>x.store==='Wayfair')||g[1]||g[0]||{}).store};
 if(silent){S.run.checked=ls.length;S.run.phase='ordering';}
}
function findChange(){
 const ls=lines();const l=ls.find(x=>x.it.id==='chair')||ls[0];
 if(!l){S.run.phase='ordering';return;}
 S.run.change={pid:l.p.id,item:l.it.id,name:l.p.name,was:l.price,now:l.price+8,delta:8};
 S.run.phase='priceChange';
}
function orderNext(){
 const r=S.run;if(!r)return;
 const placing=r.stores.find(s=>s.status==='placing');
 if(placing){
  if(placing.name===r.needs&&!placing.user){placing.status='action';r.phase='needsYou';}
  else {placing.status='placed';placing.ref=ref(placing.name);}
  render();return;
 }
 const next=r.stores.find(s=>s.status==='waiting');
 if(next){next.status='placing';render();return;}
 if(!r.stores.some(s=>s.status==='action')){r.phase='done';render();}
}

let lastDeleted=null;
const A={
 go:v=>go(v),back:()=>back(),backTo:v=>backTo(v),
 set:v=>{const [k,val]=v.split('|');S[k]=k==='cand'?+val:val;render();},

 startScan:()=>{if(S.method==='Manual'){go('review');return;}S.scanP=0;S.rescan=false;go('scanning');},

 sheet:v=>{if(v==='confirm')S.approve=false;S.sheet={type:v};render();},
 closeSheet:()=>{S.sheet=null;render();},
 setRef:v=>{const [k,len]=v.split('|');S.ref=k;S.refLen=len;render();},
 applyRef:()=>{const ratio=(parseFloat(S.refLen)||0.8)/({door:.8,outlet:.12,a4:.3}[S.ref]);Object.assign(S.dims[3],{v:Math.round(1.42*ratio*100)/100,low:false,conf:96});S.sheet=null;render();toast('Window width recalculated · 96% confidence');},
 shoot:()=>{const c=$('#cam');if(c)c.classList.add('flash');later(()=>go('editBase'),380);},
 cycleBase:v=>{const o=['keep','move','remove'];S.base[v]=o[(o.indexOf(S.base[v])+1)%3];render();},
 setBase:v=>{const [id,k]=v.split('|');S.base[id]=k;render();},
 startGen:()=>{S.genP=0;go('generating');},
 itemSheet:v=>{S.sheet={type:'itemSheet',v};render();},
 delItem:v=>{S.items[v].removed=true;lastDeleted=v;S.sheet=null;render();toast(item(v).name+' removed from your design',true);},
 undo:()=>{if(lastDeleted){S.items[lastDeleted].removed=false;lastDeleted=null;document.querySelectorAll('.toast').forEach(t=>t.remove());render();}},
 restore:v=>{S.items[v].removed=false;render();},
 openRegen:v=>{S.regen={id:v,text:'',state:'idle',look:null};go('regen');},
 sug:v=>{const r=S.regen;r.text=(r.text?r.text.replace(/[,\s]+$/,'')+', ':'')+v.toLowerCase();render();},
 regenGo:()=>{const r=S.regen;r.state='loading';render();later(()=>{const cur=conceptLook(r.id),t=r.text.toLowerCase();let color=cur.color;
   const map=[['black','#2B2B2B'],['white','#F2F0EB'],['wood','#B07F52'],['oak','#B07F52'],['walnut','#6E4B32'],['green','#8FA37E'],['blue','#8EA6C1'],['brass','#C49A45'],['gold','#C49A45'],['red','#B5562F'],['rust','#B5562F'],['texture','#D8C7A6']];
   for(const [k,c] of map) if(t.includes(k)) color=c;
   let shape=cur.shape; if(/round|small|different|shape|softer/.test(t)||color===cur.color) shape=cur.shape%3+1;
   if(r.id==='rug'&&/texture/.test(t)) shape=2;
   r.look={shape,color};r.state='done';render();},1400);},
 regenKeep:()=>{const r=S.regen;S.items[r.id].look=r.look;S.pulse=r.id;clearPulse();backTo('design');toast(item(r.id).name+' updated in your design');},

 cartQty:v=>{const [id,dl]=v.split('|');const pk=S.items[id].pick;pk.qty=Math.max(1,Math.min(9,pk.qty+(+dl)));render();},

 startOrders:()=>{startRun();go('agentRun');},
 acceptPrice:()=>{const c=S.run.change;S.bump[c.pid]=c.delta;S.run.phase='ordering';render();},
 dropChanged:()=>{const c=S.run.change;S.items[c.item].pick=null;S.run.change=null;const ls=lines();const names=new Set(groups(ls).map(x=>x.store));S.run.stores=S.run.stores.filter(s=>names.has(s.name));if(!names.has(S.run.needs))S.run.needs=null;S.run.phase='ordering';render();toast(c.name+' removed from the order');},
 skipStore:()=>{const s=S.run.stores.find(x=>x.status==='action');s.status='skipped';S.run.phase='ordering';render();},
 storePlaced:()=>{const s=S.run.stores.find(x=>x.status==='action');if(s){s.status='placed';s.user=true;s.ref=ref(s.name);}
   if(S.run.phase==='done'){backTo('result');toast(s.name+' order placed');return;}
   S.run.phase='ordering';backTo('agentRun');toast(s.name+' order placed');},
 retryStore:v=>{const s=S.run.stores.find(x=>x.name===v);s.status='action';go('handoff');},
 restart:()=>{S=fresh();render(true);},
 jump:v=>{S.sheet=null;go(v);}
};
function openDraft(pid){const p=prod(pid);const pk=S.items[p.item].pick;S.draft=pk&&pk.pid===pid?{...pk}:{pid,color:p.colors[0][1],qty:1};}
let pulseT=null;function clearPulse(){clearTimeout(pulseT);pulseT=setTimeout(()=>{S.pulse=null;},3800);}
const IN={
 dim:(v,el)=>{const i=+el.dataset.i,n=parseFloat(v);if(!isNaN(n)&&n>0){S.dims[i].v=n;if(S.dims[i].low){S.dims[i].low=false;S.dims[i].conf=100;render();el=null;}}},
 regen:v=>{S.regen.text=v;},
 ref:v=>{S.refLen=v;}
};

/* ---------- render ---------- */
function render(newScreen){
 clearTimers();
 const prevScroll=newScreen?0:(phone.querySelector('.content')?.scrollTop||0);
 const focusId=document.activeElement&&document.activeElement.id;
 const v=V[S.screen]();
 const stage=v.stage||0;
 let h=`<div class="sbar"><span>9:41</span><i>●●● ▮</i></div>`;
 if(!v.noTop){
  h+=`<div class="top">${v.back===false?'':`<button class="iconbtn" data-a="back" aria-label="Back">${IC.back}</button>`}<div class="ttl"><div class="eyebrow">${v.eyebrow||''}</div><h1>${v.title}</h1></div><div class="right">${v.right||''}</div></div>`;
  h+=`<div class="stages">${STAGES.map((s,i)=>`<div class="${i+1<stage?'done':i+1===stage?'cur':''}">${s}</div>`).join('')}</div>`;
 }
 h+=`<div class="content ${v.noTop?'':'flush'}">${v.body}</div>`;
 if(v.bottom) h+=`<div class="bottom">${v.bottom}</div>`;
 if(S.sheet) h+=`<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true">${SH[S.sheet.type](S.sheet.v)}</div></div>`;
 const toastEl=phone.querySelector('.toast');
 phone.innerHTML=h;
 if(toastEl&&!newScreen) phone.appendChild(toastEl);
 else if(toastEl&&newScreen) phone.appendChild(toastEl);
 const c=phone.querySelector('.content');if(c){c.style.scrollBehavior='auto';c.scrollTop=prevScroll;c.style.scrollBehavior='';}
 if(focusId){const f=document.getElementById(focusId);if(f&&(f.tagName==='INPUT'||f.tagName==='TEXTAREA')){f.focus();try{const l=f.value.length;f.setSelectionRange(l,l);}catch(e){}}}
 if(v.after) v.after();
 renderFlow();
}
function renderFlow(){
 const cur=S.screen;let h=`<h3>Roomwise prototype</h3><p>Tap through the phone like a real app. Use this map to jump to any step.</p>`;
 STAGES.forEach((s,i)=>{h+=`<div class="st">${i+1} · ${s}</div>`;FLOW.filter(f=>f[0]===i+1).forEach(f=>{h+=`<button class="${f[1]===cur?'on':''}" data-j="${f[1]}">${f[2]}</button>`;});});
 h+=`<button class="reset" data-j="__reset">Restart demo</button>`;
 $('#flow').innerHTML=h;
}
phone.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
 if(el.dataset.a==='scrim'){if(e.target===el){S.sheet=null;render();}return;}
 const fn=A[el.dataset.a];if(fn){e.stopPropagation();fn(el.dataset.v,el,e);}
});
phone.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.in&&IN[el.dataset.in])IN[el.dataset.in](el.value,el);});
$('#flow').addEventListener('click',e=>{const b=e.target.closest('[data-j]');if(!b)return;if(b.dataset.j==='__reset'){S=fresh();render(true);return;}
 const j=b.dataset.j;
 if(j==='scanning'){S.scanP=0;S.rescan=false;}
 if(j==='generating'){S.genP=0;}
 if(j==='agentRun'){if(!lines().length)ensure('cart');startRun();}
 if(j==='product'){ensure('results');openDraft((S.items[S.cur].pick||{}).pid||PRODUCTS[S.cur][0].id);}
 S.sheet=null;go(j);});
// keep a real phone size (390×844) and scale it down to fit smaller windows
function fit(){
 const ph=$('#phone');
 if(matchMedia('(pointer:coarse) and (max-width:500px)').matches){ph.style.transform='';ph.style.margin='';return;}
 const sc=Math.min(1,(innerHeight-24)/862,(innerWidth-24)/408);
 ph.style.transform=`scale(${sc})`;
 ph.style.margin=`${-(1-sc)*862/2}px ${-(1-sc)*408/2}px`;
}
addEventListener('resize',fit);fit();
render(true);
</script>
